<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KisanX AI - Manage your farm crops with AI-powered insights.">
  <title>My Crops | KisanX AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebarContainer"></div>
<div id="profileModalContainer"></div>

<div class="dashboard-wrapper">
  <main class="main-content">
    <div id="topNavbarInner"></div>
    <div class="page-content">

      <!-- Header + Actions -->
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
        <div>
          <h3 style="font-weight:800;color:var(--text-dark)">🌱 My Crops</h3>
          <p style="color:var(--text-light);margin:0"><span id="cropCount">0</span> active crops on your farm</p>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <!-- Search -->
          <div class="position-relative">
            <input type="text" id="cropSearch" class="form-control form-control-kisan" placeholder="Search crops..." style="padding-left:2.2rem;width:200px">
            <i class="bi bi-search position-absolute" style="left:0.75rem;top:50%;transform:translateY(-50%);color:var(--text-light);font-size:0.85rem"></i>
          </div>
          <button class="btn-kisan-primary" onclick="showModal('addCropModal')">
            <i class="bi bi-plus-circle"></i> Add Crop
          </button>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="d-flex gap-2 mb-4">
        <button class="lang-btn active crop-filter-btn" onclick="filterCrops('all')">All Crops</button>
        <button class="lang-btn crop-filter-btn" onclick="filterCrops('healthy')">✅ Healthy</button>
        <button class="lang-btn crop-filter-btn" onclick="filterCrops('attention')">⚠️ Need Attention</button>
      </div>

      <!-- Crops Grid -->
      <div class="row" id="cropsGrid">
        <div class="col-12 text-center py-4"><div class="kisan-spinner mx-auto mb-2"></div><p class="text-muted">Loading crops...</p></div>
      </div>

    </div>
  </main>
</div>

<!-- Add/Edit Crop Modal -->
<div class="modal fade" id="addCropModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:20px;border:1px solid var(--border);background:var(--card-bg)">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="addCropModalLabel" style="font-weight:800;color:var(--text-dark)">🌱 Add New Crop</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="addCropForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-bold fs-7">Crop Name *</label>
              <select id="cropName" class="form-select form-control-kisan" required>
                <option value="">Select crop</option>
                <option value="Tomato">🍅 Tomato</option>
                <option value="Onion">🧅 Onion</option>
                <option value="Wheat">🌾 Wheat</option>
                <option value="Soybean">🫘 Soybean</option>
                <option value="Cotton">🌿 Cotton</option>
                <option value="Potato">🥔 Potato</option>
                <option value="Chili">🌶️ Chili</option>
                <option value="Maize">🌽 Maize</option>
                <option value="Sugarcane">🎋 Sugarcane</option>
                <option value="Rice">🍚 Rice</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold fs-7">Area (Acres) *</label>
              <input type="number" id="cropArea" class="form-control form-control-kisan" placeholder="e.g. 2" min="0.1" step="0.1" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold fs-7">Planting Date *</label>
              <input type="date" id="plantingDate" class="form-control form-control-kisan" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-bold fs-7">Soil Type *</label>
              <select id="cropSoil" class="form-select form-control-kisan" required>
                <option value="Loamy">Loamy</option>
                <option value="Sandy Loam">Sandy Loam</option>
                <option value="Clayey">Clayey</option>
                <option value="Black">Black (Regur)</option>
                <option value="Red">Red Laterite</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label fw-bold fs-7">Growth Stage *</label>
              <select id="cropStage" class="form-select form-control-kisan" required>
                <option value="Seedling">🌱 Seedling</option>
                <option value="Vegetative">🌿 Vegetative</option>
                <option value="Flowering">🌸 Flowering</option>
                <option value="Fruiting">🍅 Fruiting</option>
                <option value="Maturity">⭐ Maturity</option>
                <option value="Grain Filling">🌾 Grain Filling</option>
                <option value="Bulbing">🧅 Bulbing</option>
                <option value="Boll Formation">🌿 Boll Formation</option>
              </select>
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="button" class="btn-kisan-outline flex-fill justify-content-center py-2" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-kisan-primary flex-fill justify-content-center py-2">
              <i class="bi bi-check2-circle"></i> Save Crop
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Crop Detail Modal -->
<div class="modal fade" id="cropDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:20px;border:1px solid var(--border);background:var(--card-bg)">
      <div class="modal-header border-0">
        <h5 class="modal-title" style="font-weight:800;color:var(--text-dark)">Crop Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="cropDetailContent"></div>
    </div>
  </div>
</div>

<div id="bottomNavContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ui-builder.js"></script>
<script src="js/crops.js"></script>
<script>
  document.getElementById('sidebarContainer').innerHTML = buildSidebar('crops');
  document.getElementById('topNavbarInner').innerHTML = buildTopNavbar('My Crops', '🌱 Farm Management');
  document.getElementById('profileModalContainer').innerHTML = buildProfileModal();
  document.getElementById('bottomNavContainer').innerHTML = buildBottomNav('crops');
</script>
</body>
</html>
