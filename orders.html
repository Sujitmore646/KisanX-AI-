<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KisanX AI Orders - Track all your crop orders and delivery status.">
  <title>Orders | KisanX AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebarContainer"></div>
<div id="profileModalContainer"></div>

<div class="dashboard-wrapper">
  <main class="main-content">
    <div id="topNavbarInner"></div>
    <div class="page-content">

      <!-- Header -->
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
        <div>
          <h3 style="font-weight:800;color:var(--text-dark)">📦 Order Management</h3>
          <p style="color:var(--text-light);margin:0">Track and manage all your crop sales orders</p>
        </div>
        <button class="btn-kisan-primary" onclick="showModal('newOrderModal')">
          <i class="bi bi-plus-circle"></i> New Order
        </button>
      </div>

      <!-- Order Stats -->
      <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
          <div class="stat-card text-center">
            <div style="font-size:1.8rem">📦</div>
            <div class="stat-value" id="count-all">0</div>
            <div class="stat-label">Total Orders</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card text-center">
            <div style="font-size:1.8rem">⏳</div>
            <div class="stat-value" id="count-pending">0</div>
            <div class="stat-label" style="color:#D97706">Pending</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card text-center">
            <div style="font-size:1.8rem">🚛</div>
            <div class="stat-value" id="count-in_transit">0</div>
            <div class="stat-label" style="color:#7C3AED">In Transit</div>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="stat-card text-center">
            <div style="font-size:1.8rem">✅</div>
            <div class="stat-value" id="count-delivered">0</div>
            <div class="stat-label" style="color:#15803D">Delivered</div>
          </div>
        </div>
      </div>

      <!-- Filter Tabs -->
      <div class="d-flex gap-2 flex-wrap mb-4">
        <button class="lang-btn active order-tab-btn" onclick="filterOrders('all')">All Orders</button>
        <button class="lang-btn order-tab-btn" onclick="filterOrders('pending')">⏳ Pending</button>
        <button class="lang-btn order-tab-btn" onclick="filterOrders('confirmed')">✅ Confirmed</button>
        <button class="lang-btn order-tab-btn" onclick="filterOrders('in_transit')">🚛 In Transit</button>
        <button class="lang-btn order-tab-btn" onclick="filterOrders('delivered')">📦 Delivered</button>
      </div>

      <!-- Orders List -->
      <div id="ordersContainer">
        <div class="text-center py-4"><div class="kisan-spinner mx-auto mb-2"></div><p class="text-muted">Loading orders...</p></div>
      </div>

    </div>
  </main>
</div>

<!-- New Order Modal -->
<div class="modal fade" id="newOrderModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:20px;border:1px solid var(--border);background:var(--card-bg)">
      <div class="modal-header border-0">
        <h5 class="modal-title" style="font-weight:800;color:var(--text-dark)">📦 Create New Order</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-bold fs-7">🌾 Crop</label>
            <select id="newOrderCrop" class="form-select form-control-kisan">
              <option value="">Select crop</option>
              <option value="Tomato">🍅 Tomato</option>
              <option value="Onion">🧅 Onion</option>
              <option value="Wheat">🌾 Wheat</option>
              <option value="Soybean">🫘 Soybean</option>
              <option value="Cotton">🌿 Cotton</option>
              <option value="Potato">🥔 Potato</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold fs-7">📦 Quantity (Quintal)</label>
            <input type="number" id="newOrderQty" class="form-control form-control-kisan" placeholder="e.g. 50" min="1">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold fs-7">🤝 Buyer Name</label>
            <input type="text" id="newOrderBuyer" class="form-control form-control-kisan" placeholder="Buyer company name">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold fs-7">💰 Price (₹/Quintal)</label>
            <input type="number" id="newOrderPrice" class="form-control form-control-kisan" placeholder="e.g. 2800" min="1">
          </div>
        </div>
        <div class="d-flex gap-2 mt-4">
          <button class="btn-kisan-outline flex-fill justify-content-center py-2" data-bs-dismiss="modal">Cancel</button>
          <button class="btn-kisan-primary flex-fill justify-content-center py-2" onclick="submitNewOrder()">
            <i class="bi bi-plus-circle"></i> Create Order
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="bottomNavContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ui-builder.js"></script>
<script src="js/orders.js"></script>
<script>
  document.getElementById('sidebarContainer').innerHTML = buildSidebar('orders');
  document.getElementById('topNavbarInner').innerHTML = buildTopNavbar('Orders', '📦 Order Management');
  document.getElementById('profileModalContainer').innerHTML = buildProfileModal();
  document.getElementById('bottomNavContainer').innerHTML = buildBottomNav('orders');
</script>

<!-- Vercel Speed Insights -->
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
