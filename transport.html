<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KisanX AI Smart Transport - Book vehicles for crop transportation at fair rates.">
  <title>Smart Transport | KisanX AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebarContainer"></div>
<div id="profileModalContainer"></div>

<div class="dashboard-wrapper">
  <main class="main-content">
    <div id="topNavbarInner"></div>
    <div class="page-content">

      <div class="mb-4">
        <h3 style="font-weight:800;color:var(--text-dark)">🚚 Smart Transport</h3>
        <p style="color:var(--text-light)">Book reliable vehicles for your crop transportation at fair rates</p>
      </div>

      <!-- Booking Success Alert -->
      <div id="bookingSuccess" style="display:none"></div>

      <div class="row g-3">
        <!-- Search Form -->
        <div class="col-lg-4">
          <div class="kisan-card">
            <div class="kisan-card-header">
              <span class="kisan-card-title"><i class="bi bi-search"></i> Find Transport</span>
            </div>
            <form id="transportSearchForm">
              <div class="mb-3">
                <label class="form-label fw-bold fs-7">🌾 Crop to Transport</label>
                <select id="transCrop" class="form-select form-control-kisan" required>
                  <option value="">Select crop</option>
                  <option value="Tomato">🍅 Tomato</option>
                  <option value="Onion">🧅 Onion</option>
                  <option value="Wheat">🌾 Wheat</option>
                  <option value="Soybean">🫘 Soybean</option>
                  <option value="Cotton">🌿 Cotton</option>
                  <option value="Potato">🥔 Potato</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold fs-7">📦 Quantity (Tonnes)</label>
                <input type="number" id="transQty" class="form-control form-control-kisan" placeholder="e.g. 2" min="0.1" step="0.1" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold fs-7">📍 Pickup Location</label>
                <input type="text" id="transPickup" class="form-control form-control-kisan" value="Nashik Farm, Maharashtra" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold fs-7">🎯 Destination</label>
                <input type="text" id="transDest" class="form-control form-control-kisan" placeholder="e.g. Nashik APMC" required>
              </div>
              <div class="mb-4">
                <label class="form-label fw-bold fs-7">📅 Date</label>
                <input type="date" id="transDate" class="form-control form-control-kisan" required>
              </div>
              <button type="submit" class="btn-kisan-primary w-100 py-3 justify-content-center">
                <i class="bi bi-search"></i> Search Transport
              </button>
            </form>

            <div class="divider"></div>
            <div style="font-size:0.8rem;font-weight:700;color:var(--text-dark);margin-bottom:0.5rem">Filter By Type</div>
            <div class="d-flex flex-column gap-2">
              <button class="vehicle-filter-btn btn-kisan-outline py-1 justify-content-center active" style="font-size:0.8rem" onclick="filterVehiclesByType('all')">All Vehicles</button>
              <button class="vehicle-filter-btn btn-kisan-outline py-1 justify-content-center" style="font-size:0.8rem" onclick="filterVehiclesByType('truck')">🚛 Trucks</button>
              <button class="vehicle-filter-btn btn-kisan-outline py-1 justify-content-center" style="font-size:0.8rem" onclick="filterVehiclesByType('tractor')">🚜 Tractor</button>
              <button class="vehicle-filter-btn btn-kisan-outline py-1 justify-content-center" style="font-size:0.8rem" onclick="filterVehiclesByType('refrigerated')">❄️ Refrigerated</button>
            </div>
          </div>
        </div>

        <!-- Vehicles Grid -->
        <div class="col-lg-8" id="vehiclesSection">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <h5 style="font-weight:700;color:var(--text-dark);margin:0">Available Vehicles</h5>
            <span class="ai-demo-badge">🤖 Demo Mode</span>
          </div>
          <div class="row" id="vehiclesGrid">
            <div class="col-12 text-center py-4"><div class="kisan-spinner mx-auto mb-2"></div><p class="text-muted">Loading vehicles...</p></div>
          </div>
        </div>
      </div>

      <!-- Recent Bookings -->
      <div class="kisan-card mt-4">
        <div class="kisan-card-header">
          <span class="kisan-card-title"><i class="bi bi-clock-history"></i> Recent Bookings</span>
        </div>
        <div id="recentBookings">
          <div class="empty-state py-3">
            <div class="empty-state-icon" style="font-size:2rem">📋</div>
            <p class="text-muted">No recent bookings. Book your first transport!</p>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<div id="bottomNavContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ui-builder.js"></script>
<script src="js/transport.js"></script>
<script>
  document.getElementById('sidebarContainer').innerHTML = buildSidebar('transport');
  document.getElementById('topNavbarInner').innerHTML = buildTopNavbar('Smart Transport', '🚚 Book Vehicles at Fair Rates');
  document.getElementById('profileModalContainer').innerHTML = buildProfileModal();
  document.getElementById('bottomNavContainer').innerHTML = buildBottomNav('transport');

  // Set default date to tomorrow
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('transDate').value = tomorrow.toISOString().split('T')[0];

  // Load recent bookings
  document.addEventListener('DOMContentLoaded', () => {
    const bookings = loadFromStorage('transportBookings') || [];
    const container = document.getElementById('recentBookings');
    if (bookings.length > 0) {
      container.innerHTML = bookings.slice(-3).reverse().map(b => `
        <div class="d-flex align-items-center gap-3 py-2" style="border-bottom:1px solid var(--border)">
          <div style="width:40px;height:40px;background:var(--green-light);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem">🚛</div>
          <div style="flex:1">
            <div style="font-weight:700;font-size:0.875rem">${b.vehicleType} • ${b.crop}</div>
            <div style="font-size:0.75rem;color:var(--text-light)">To: ${b.dest} | ${formatDate(b.date)}</div>
          </div>
          <div>
            <div style="font-weight:700;color:var(--green-dark)">${formatCurrency(b.cost)}</div>
            <span class="badge bg-success" style="font-size:0.65rem">${b.status}</span>
          </div>
        </div>`).join('');
    }
  });
</script>
</body>
</html>
