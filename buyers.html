<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KisanX AI - Find verified buyers for your crops at best prices.">
  <title>Find Buyers | KisanX AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="sidebarContainer"></div>
<div id="profileModalContainer"></div>

<div class="dashboard-wrapper">
  <main class="main-content">
    <div id="topNavbarInner"></div>
    <div class="page-content">

      <!-- Header -->
      <div class="mb-4">
        <h3 style="font-weight:800;color:var(--text-dark)">🤝 Find Best Buyers</h3>
        <p style="color:var(--text-light)">Connect directly with verified buyers for better prices</p>
      </div>

      <div class="row g-3">
        <!-- Filter Sidebar -->
        <div class="col-lg-3">
          <div class="kisan-card">
            <div class="kisan-card-header">
              <span class="kisan-card-title"><i class="bi bi-funnel-fill"></i> Filter Buyers</span>
            </div>
            <form id="buyerFilterForm">
              <div class="mb-3">
                <label class="form-label" style="font-weight:600;font-size:0.875rem;color:var(--text-dark)">🌾 Crop</label>
                <select id="filterCrop" class="form-select form-control-kisan">
                  <option value="">All Crops</option>
                  <option value="Tomato">🍅 Tomato</option>
                  <option value="Onion">🧅 Onion</option>
                  <option value="Potato">🥔 Potato</option>
                  <option value="Wheat">🌾 Wheat</option>
                  <option value="Soybean">🫘 Soybean</option>
                  <option value="Cotton">🌿 Cotton</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label" style="font-weight:600;font-size:0.875rem;color:var(--text-dark)">📦 Quantity (Quintal)</label>
                <input type="number" id="filterQty" class="form-control form-control-kisan" placeholder="Min quantity" min="1">
              </div>
              <div class="mb-4">
                <label class="form-label" style="font-weight:600;font-size:0.875rem;color:var(--text-dark)">💰 Min Price (₹/Q)</label>
                <input type="number" id="filterPrice" class="form-control form-control-kisan" placeholder="Min offered price" min="0">
              </div>
              <button type="submit" class="btn-kisan-primary w-100 justify-content-center">
                <i class="bi bi-search"></i> Find Buyers
              </button>
              <button type="button" class="btn-kisan-outline w-100 mt-2 justify-content-center" onclick="document.getElementById('buyerFilterForm').reset();renderBuyers(buyersData)">
                <i class="bi bi-arrow-counterclockwise"></i> Reset
              </button>
            </form>

            <div class="divider"></div>
            <div style="font-size:0.8rem;font-weight:700;color:var(--text-dark);margin-bottom:0.5rem">Sort By</div>
            <div class="d-flex flex-column gap-2">
              <button class="btn-kisan-outline py-1 justify-content-center" style="font-size:0.8rem" onclick="sortBuyers('price')">💰 Highest Price</button>
              <button class="btn-kisan-outline py-1 justify-content-center" style="font-size:0.8rem" onclick="sortBuyers('rating')">⭐ Best Rating</button>
              <button class="btn-kisan-outline py-1 justify-content-center" style="font-size:0.8rem" onclick="sortBuyers('distance')">📍 Nearest First</button>
            </div>
          </div>
        </div>

        <!-- Buyers Grid -->
        <div class="col-lg-9">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <div style="font-weight:600;color:var(--text-dark)">
              <span id="buyerCount">0</span> buyers found
            </div>
            <div class="d-flex gap-2">
              <button class="nav-icon-btn" title="Grid View" onclick="showToast('Grid view active', 'info')"><i class="bi bi-grid"></i></button>
              <button class="nav-icon-btn" title="List View" onclick="showToast('List view active', 'info')"><i class="bi bi-list-ul"></i></button>
            </div>
          </div>
          <div class="row" id="buyersGrid">
            <div class="col-12 text-center py-4"><div class="kisan-spinner mx-auto mb-2"></div><p class="text-muted">Loading buyers...</p></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Buyer Detail Modal -->
<div class="modal fade" id="buyerDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:20px;border:1px solid var(--border);background:var(--card-bg)">
      <div class="modal-header border-0">
        <h5 class="modal-title" style="font-weight:800;color:var(--text-dark)">Buyer Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-0" id="buyerDetailContent"></div>
    </div>
  </div>
</div>

<!-- Send Offer Modal -->
<div class="modal fade" id="sendOfferModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:20px;border:1px solid var(--border);background:var(--card-bg)">
      <div class="modal-header border-0">
        <h5 class="modal-title" style="font-weight:800;color:var(--text-dark)">📤 Send Offer</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3 p-3 rounded-3" style="background:var(--green-light);border:1px solid rgba(34,197,94,0.3)">
          <div style="font-size:0.8rem;color:var(--green-dark);font-weight:700">Sending offer to:</div>
          <div id="offerBuyerName" style="font-weight:800;color:var(--green-dark)"></div>
        </div>
        <form id="sendOfferForm">
          <div class="mb-3">
            <label class="form-label fw-bold fs-7">🌾 Crop to Sell</label>
            <select id="offerCrop" class="form-select form-control-kisan" required>
              <option value="">Select crop</option>
              <option value="Tomato">🍅 Tomato</option>
              <option value="Onion">🧅 Onion</option>
              <option value="Wheat">🌾 Wheat</option>
              <option value="Soybean">🫘 Soybean</option>
              <option value="Cotton">🌿 Cotton</option>
              <option value="Potato">🥔 Potato</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold fs-7">📦 Quantity (Quintal)</label>
            <input type="number" id="offerQty" class="form-control form-control-kisan" placeholder="e.g. 50" min="1" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold fs-7">💰 Your Asking Price (₹/Quintal)</label>
            <input type="number" id="offerSuggestedPrice" class="form-control form-control-kisan" placeholder="e.g. 2800" min="1" required>
          </div>
          <button type="button" class="btn-kisan-primary w-100 py-3 justify-content-center" onclick="submitOffer()">
            <i class="bi bi-send-fill"></i> Send Offer Now
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="bottomNavContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ui-builder.js"></script>
<script src="js/buyers.js"></script>
<script>
  document.getElementById('sidebarContainer').innerHTML = buildSidebar('buyers');
  document.getElementById('topNavbarInner').innerHTML = buildTopNavbar('Find Buyers', '🤝 Verified Buyer Network');
  document.getElementById('profileModalContainer').innerHTML = buildProfileModal();
  document.getElementById('bottomNavContainer').innerHTML = buildBottomNav('buyers');
</script>
</body>
</html>
